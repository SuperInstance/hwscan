[package]
name = "hwscan"
version = "0.1.0"
edition = "2021"

[workspace]

rust-version = "1.70"
authors = ["SuperInstance <info@superinstance.ai>"]
description = "Cross-platform hardware detection and tier calculation"
documentation = "https://docs.rs/hwscan"
repository = "https://github.com/SuperInstance/hwscan"
homepage = "https://github.com/SuperInstance/hwscan"
readme = "README.md"
keywords = ["hardware", "detection", "system", "gpu", "cpu"]
categories = ["hardware-support", "os"]
license = "MIT OR Apache-2.0"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]

[features]
default = ["cli"]
cli = ["clap", "serde_json"]

[dependencies]
sysinfo = "0.39"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
dirs = "5.0"
tracing = "0.1"
thiserror = "2.0"

[dependencies.clap]
version = "4.4"
features = ["derive"]
optional = true

[dev-dependencies]
tempfile = "3.8"

[[bin]]
name = "hwscan"
path = "src/main.rs"
required-features = ["cli"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
